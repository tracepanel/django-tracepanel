# django-tracepanel: the name Django developers search for. No code of its own: it installs tracepanel with Django
# (`tracepanel[django]`), any patch of its own minor version, so `pip install django-tracepanel` and
# `pip install "tracepanel[django]"` are the same thing. Released on each minor of tracepanel, with the pin below
# covering that minor; tracepanel's patches reach it without a release here.
[project]
name = "django-tracepanel"
version = "0.10.0"
description = "Traces and logs for Django apps: installs tracepanel with Django support, the same as tracepanel[django]"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["tracepanel[django]>=0.10.0,<0.11"]
keywords = [
    "django",
    "debug toolbar",
    "n+1",
    "sql",
    "orm",
    "tracing",
    "logging",
    "profiling",
    "celery",
    "django rest framework",
    "pytest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Framework :: Celery",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://tracepanel.dev"
Documentation = "https://tracepanel.dev/docs/django"
Source = "https://github.com/tracepanel/tracepanel"
Repository = "https://github.com/tracepanel/django-tracepanel"
Changelog = "https://github.com/tracepanel/django-tracepanel/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["codespell>=2.4.3", "poethepoet>=0.48.0"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

# A distribution with no modules: only the metadata above.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "README.md"]

[tool.uv]
default-groups = ["dev"]

[tool.poe.tasks.lint]
help = "Check the spelling of the README and the changelog"
sequence = ["codespell README.md CHANGELOG.md"]
default_item_type = "cmd"

[tool.uv.sources]
# Unpublished: resolve tracepanel from this checkout.
tracepanel = { path = "../tracepanel-python", editable = true }
