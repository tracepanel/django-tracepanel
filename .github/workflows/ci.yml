# The package, checked against tracepanel-python, and the README's spelling. The documentation is at
# https://tracepanel.dev/docs/django.
#
# The package installs tracepanel, which requires tracepanel-agent, built from its checkout. Both are checked out next
# to this one, where uv.lock expects them (../tracepanel-python, ../tracepanel). Nothing is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.code.outputs.code == 'true' }}
    steps:
      # A pull request that changes only the pages (the README and its images, the changelog) or the license builds
      # nothing: Package, skipped whole, counts as passed. Lint checks the pages, so it always runs.
      - if: github.event_name == 'pull_request'
        id: code
        uses: dorny/paths-filter@v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!LICENSE"
              - "!docs/**"
              - "!assets/**"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Spelling of the README and the changelog
        run: uvx codespell README.md CHANGELOG.md

  package:
    name: Package
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: django-tracepanel
    steps:
      - uses: actions/checkout@v7
        with:
          path: django-tracepanel

      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel-python
          path: tracepanel-python

      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          path: tracepanel

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: django-tracepanel

      - name: Same minor as tracepanel, pinned to it
        run: |
          uv run --no-project --python 3.13 --with packaging python - <<'PY'
          import tomllib
          from packaging.requirements import Requirement
          from packaging.version import Version
          proxy = tomllib.load(open("pyproject.toml", "rb"))["project"]
          tracepanel = Version(tomllib.load(open("../tracepanel-python/pyproject.toml", "rb"))["project"]["version"])
          version = Version(proxy["version"])
          (pin,) = (Requirement(dep) for dep in proxy["dependencies"])
          major, minor = tracepanel.release[:2]
          assert version.release[:2] == (major, minor), f"django-tracepanel {version}, tracepanel {tracepanel}: another minor"
          assert pin.name == "tracepanel" and pin.extras == {"django"}, f"pins {pin}"
          lower = next((Version(s.version) for s in pin.specifier if s.operator == ">="), None)
          bounds = {s.operator + s.version for s in pin.specifier}
          assert lower is not None and bounds == {f">={lower}", f"<{major}.{minor + 1}"}, f"pins {pin}: not one minor"
          assert pin.specifier.contains(tracepanel), f"django-tracepanel pins {pin}, tracepanel is {tracepanel}"
          print(f"django-tracepanel {version} pins {pin}, tracepanel is {tracepanel}")
          PY

      - name: Build
        run: |
          uv build --out-dir dist
          uv build --wheel --out-dir ../wheels ../tracepanel-python

      - name: Install as a user would, and import
        run: |
          uv venv ../try
          uv pip install --python ../try --find-links ../wheels dist/django_tracepanel-*.whl
          ../try/bin/python -c "import django, tracepanel.django; print('Django', django.get_version(), '+ tracepanel.django')"

      - uses: actions/upload-artifact@v7
        with:
          name: django-tracepanel-dist
          path: django-tracepanel/dist
          retention-days: 30
          if-no-files-found: error
