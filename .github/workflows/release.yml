name: Release

# A tag that names a version publishes it to PyPI. Nothing else does. Release tracepanel first: this package pins
# tracepanel[django] to its own minor, and the job installs it from PyPI before publishing.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/django-tracepanel/
    permissions:
      # What PyPI's trusted publishing signs the upload with, in place of a token.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: The tag is the version, and tracepanel's pin covers its minor
        run: |
          uv run --no-project --with packaging python - <<'EOF'
          import os, sys, tomllib
          from packaging.requirements import Requirement
          from packaging.version import Version
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          tracepanel = next(Requirement(dep) for dep in project["dependencies"] if dep.startswith("tracepanel"))
          tag, version = Version(os.environ["GITHUB_REF_NAME"]), Version(project["version"])
          major, minor = version.release[:2]
          lower = next((Version(s.version) for s in tracepanel.specifier if s.operator == ">="), None)
          covers = (
              lower is not None
              and lower.release[:2] == (major, minor)
              and {s.operator + s.version for s in tracepanel.specifier} == {f">={lower}", f"<{major}.{minor + 1}"}
          )
          if tag != version or not covers:
              sys.exit(f"::error::tag {tag}, version {version}, tracepanel {tracepanel.specifier}: the tag must be the "
                       f"version, tracepanel >={major}.{minor}.N,<{major}.{minor + 1}")
          EOF

      - name: Build
        run: uv build --out-dir dist

      - name: Install from PyPI as a user would, and import
        run: |
          uv venv try
          uv pip install --python try dist/django_tracepanel-*.whl
          try/bin/python -c "import django, tracepanel.django; print('Django', django.get_version(), '+ tracepanel.django')"
          try/bin/tracepanel-agent --version

      - name: Publish
        run: uv publish --trusted-publishing always dist/*

  # The release on GitHub, after the registry took it: its notes are the changelog's entry for the version.
  github:
    name: GitHub release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v head="## $GITHUB_REF_NAME " 'index($0, head) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no entry for $GITHUB_REF_NAME" && exit 1; fi
          case "$GITHUB_REF_NAME" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*|*-*) pre=--prerelease ;;
            *) pre= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $pre
