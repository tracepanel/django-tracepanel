name: Release

# A tag that names a version publishes it to PyPI. Nothing else does. Release tracepanel first: this package pins
# tracepanel[django] at its own version, and the job installs it from PyPI before publishing.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/django-tracepanel/
    permissions:
      # What PyPI's trusted publishing signs the upload with, in place of a token.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: The tag is the version, and tracepanel's
        run: |
          uv run --no-project --with packaging python - <<'EOF'
          import os, sys, tomllib
          from packaging.requirements import Requirement
          from packaging.version import Version
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          tracepanel = next(Requirement(dep) for dep in project["dependencies"] if dep.startswith("tracepanel"))
          tag, version = Version(os.environ["GITHUB_REF_NAME"]), Version(project["version"])
          if not tag == version or str(tracepanel.specifier) != f"=={version}":
              sys.exit(f"::error::tag {tag}, version {version}, tracepanel {tracepanel.specifier}: they must agree")
          EOF

      - name: Build
        run: uv build --out-dir dist

      - name: Install from PyPI as a user would, and import
        run: |
          uv venv try
          uv pip install --python try dist/django_tracepanel-*.whl
          try/bin/python -c "import django, tracepanel.django; print('Django', django.get_version(), '+ tracepanel.django')"
          try/bin/tracepanel-agent --version

      - name: Publish
        run: uv publish --trusted-publishing always dist/*
